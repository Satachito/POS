[versions]
agp = "8.9.1"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2025.01.00"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigation = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"

[libraries]
androidx-core-ktx           = { group = "androidx.core",             name = "core-ktx",                    version = "1.15.0" }
androidx-activity-compose   = { group = "androidx.activity",         name = "activity-compose",            version.ref = "activityCompose" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-compose  = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation",       name = "navigation-compose",          version.ref = "navigation" }
compose-bom                 = { group = "androidx.compose",          name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-tooling          = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
room-runtime                = { group = "androidx.room",             name = "room-runtime",                version.ref = "room" }
room-ktx                    = { group = "androidx.room",             name = "room-ktx",                    version.ref = "room" }
room-compiler               = { group = "androidx.room",             name = "room-compiler",               version.ref = "room" }
datastore-preferences       = { group = "androidx.datastore",        name = "datastore-preferences",       version.ref = "datastore" }
okhttp                      = { group = "com.squareup.okhttp3",      name = "okhttp",                      version.ref = "okhttp" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",  version.ref = "serialization" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",  version.ref = "coroutines" }

[plugins]
android-application  = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
